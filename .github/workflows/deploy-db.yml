# 本番のデータベースに supabase/migrations/ の変更を反映する（docs/setup.md ⑤）。
# 自動では動かない。GitHub の「Actions」タブで「Run workflow」を押したときだけ動く。
# 「確認だけ」は反映される変更の一覧を出すだけで、本番は変わらない。
# ダミーデータ（seed）は入れない。
name: 本番のデータベースを更新

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 何をするか
        type: choice
        options:
          - 確認だけ（反映しない）
          - 本番に反映する
        default: 確認だけ（反映しない）

concurrency:
  group: production-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  db:
    name: 本番のデータベース
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: 設定の確認
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::「Use workflow from」で main を選んで実行してください（本番に出すのは main だけ）"
            exit 1
          fi
          missing=""
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::GitHub の Secrets に次の値が入っていません:$missing（docs/setup.md ④ を参照）"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 本番のプロジェクトにつなぐ
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: 反映される変更の一覧
        run: |
          npx supabase db push --dry-run 2>&1 | tee dry-run.txt
          {
            echo "## 反映される変更の一覧"
            echo '```'
            cat dry-run.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 本番に反映
        if: inputs.mode == '本番に反映する'
        run: |
          npx supabase db push --yes
          echo "本番に反映しました。" >> "$GITHUB_STEP_SUMMARY"
